{% extends "base.html" %}
{% block title %}Login Page{% endblock%}
{% block content %}

<style>
    *{
        margin: 0;
        padding: 0;
        text-decoration: none;
        list-style: none;
    }
    body{
        background-image: url(https://sciencelogic.com/wp-content/uploads/2021/04/blog-header-ema-automation-infographic-1.jpg);
        width: 100%;
        height: 200px;
    }
    form{
        height: 250px;
        width: 700px;
        border: 5px solid white ;
        position: relative;
        align-items: center;
        justify-content: center;
        left: 20%;
        padding: 10px 10px ;
    }
    form input{
        font-size: 20px;
        margin-left: 20px;
        margin-top: 10px;
        margin-bottom: 5px;
        padding: 5px 20px;
        border: none;
    }
    form label{
        font-size: 20px;
        margin-left: 20px;
        color: white;
    }
    form a{
        font-size: 20px;
        margin-left: 20px;
        color: white;
    }
    form button{
        font-size: 20px;
        margin-left: 20px;
        margin-top: 10px;
        margin-bottom: 5px;
        background-color: rgba(15, 123, 177, 0.948);
        border: none;
        border-radius: 5px;
        padding: 5px 20px;
    }
    h2{
        font-size: 40px;
        margin-bottom: 20px;
        padding-top: 40px;
        color: white;
    }
    form p{
        font-size: 15px;
        margin-left: 20px;
        color: white;
        margin-bottom: 10px;
    }
    form a:hover{
        font-size: 20px;
        margin-left: 20px;
        color: rgb(11, 77, 183);
    }
</style>

<div class="container">
    <div class="login-container">
        <h2><center>Login</center></h2>
        <form action="/login" method="POST">
            <label for="email">User Id</label>
            <br>
            <input name='email' type="email" id="email" placeholder="Enter your user_id" required>
            <br>
            <label for="password">Password</label>
            <br>
            <input name='password' type="password" id="pass" placeholder="Enter your password" required>
            <br>
            <button type="submit" class="login-btn">Login</button>
            <br>
            <p>If you are not regesterd then regester first!</p>
            <a href="{{url_for('register')}}">Click me! for regester</a>
        </form>
    </div>
</div>
{% endblock%}
